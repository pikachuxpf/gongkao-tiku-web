services:
  gongkaotiku-web:
    build:
      context: .
    image: gongkaotiku-web:production
    container_name: gongkaotiku-web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:18790:5173"
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
